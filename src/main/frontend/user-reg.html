<!DOCTYPE html>

<html>
<head>


</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mySite/user-reg.html</title>
<body>
    
    <h1>Saving Analysis</h1>
    <h2>Registration</h2>

    <form action="saving-profile-reg.html" method = "get">
        <fieldset>
            <legend> User registration </legend>
            <table role="presentation">
                <tr>
                    <td><label for = "username">Username</label></td>
                    <td><input id = "username" name="username" type="text"
                        minlength = "3" maxlength = "10" size = "25"
                        required autofocus></td>
                </tr>

                <tr>
                    <td><label for = "email">Email:</label></td>
                    <td><input id = "email" name="email" type="email"
                        minlength="3" maxlength = "20" size = "25"
                        required></td>
                </tr>
            </table>

        </fieldset>
        <button type="submit">Create</button>
    </form>



</body>






</html>
