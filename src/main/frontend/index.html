<!DOCTYPE html > 

<html lang="eu">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>mySite/index.html</title>
    </head>

    <body>
        <h1>Saving Analysis</h1>
        <h2>Login</h2>

        <form action="saving-profile-login.html" method="get">
            <fieldset>
                <legend> User login </legend>
                <table role="presentation">
                    
                    <tr>
                        <td><label for="username">Username:</label></td>
                        <td><input id="username" name="username" type="text"
                            minlength = "3" maxlength = "10" size ="25"
                            autocomplete="username" required autofocus></td>
                    </tr>

                    <tr>
                        <td><label for="email">Email:</label></td>
                        <td><input id="email" name = "email" type="email"
                            minlength = "3" maxlength = "20" size="25"
                            autocomplete="email" required ></td>
                    </tr>

                </table> 



            </fieldset>

            <button type = "submit">Login</button>


            <a href="user-reg.html"> <button type="button"> Registration </button> </a>

        </form>






    </body>
